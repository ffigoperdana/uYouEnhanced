name: Build uYouEnhanced iOS 15 - Legacy Toolchain

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced source commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT UYOUENHANCED IOS 15 RELEASE
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. PATCH OLD MUTABLE COLLECTION ASSIGNMENTS
      #
      # Newer Clang rejects e.g.
      #
      # NSMutableArray *x = %orig;
      #
      # if %orig returns NSArray.
      #
      # This converts it to:
      #
      # NSArray *original = %orig;
      # NSMutableArray *x = [original mutableCopy];
      # ============================================================

      - name: Patch legacy mutable collection assignments
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("main")

          extensions = {
              ".x",
              ".xm",
              ".m",
              ".mm",
          }

          types = {
              "NSMutableArray": "NSArray",
              "NSMutableDictionary": "NSDictionary",
              "NSMutableSet": "NSSet",
              "NSMutableOrderedSet": "NSOrderedSet",
          }

          pattern = re.compile(
              r'^(?P<indent>\s*)'
              r'(?P<mutable>'
              r'NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet'
              r')'
              r'(?P<generic>\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'(?P<var>[A-Za-z_][A-Za-z0-9_]*)'
              r'\s*=\s*'
              r'(?P<orig>%orig(?:\([^;\n]*\))?)'
              r'\s*;'
              r'(?P<tail>\s*(?://.*)?)$'
          )

          total = 0

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix not in extensions:
                  continue

              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue

              output = []
              changed = False

              for line in original.splitlines():

                  m = pattern.match(line)

                  if not m:
                      output.append(line)
                      continue

                  indent = m.group("indent")
                  mutable = m.group("mutable")
                  immutable = types[mutable]
                  generic = m.group("generic") or ""
                  var = m.group("var")
                  orig = m.group("orig")
                  tail = m.group("tail") or ""

                  tmp = f"__uye_original_{var}"

                  first = (
                      f"{indent}"
                      f"{immutable}{generic} *{tmp} = {orig};"
                  )

                  second = (
                      f"{indent}"
                      f"{mutable}{generic} *{var} = "
                      f"[{tmp} mutableCopy];"
                      f"{tail}"
                  )

                  print("")
                  print(f"PATCH: {path}")
                  print(f"OLD: {line}")
                  print(f"NEW: {first}")
                  print(f"     {second}")

                  output.append(first)
                  output.append(second)

                  total += 1
                  changed = True

              if changed:

                  ending = "\n" if original.endswith("\n") else ""

                  path.write_text(
                      "\n".join(output) + ending
                  )

          print("")
          print("==========================================")
          print("MUTABLE PATCH SUMMARY")
          print("==========================================")
          print(f"Total patched assignments: {total}")
          PY


      # ============================================================
      # 3. INSTALL HOST DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            pipx


      - name: Configure PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 4. CHECKOUT THEOS
      #
      # IMPORTANT:
      # fetch-depth 0 lets us select the Theos revision that existed
      # around the uYouEnhanced June 2025 release.
      # ============================================================

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          fetch-depth: 0
          submodules: false


      # ============================================================
      # 5. PIN THEOS + LOGOS TO JUNE 2025
      #
      # Instead of using 2026 master, select the last Theos commit
      # that existed before June 14 2025 and initialize the exact
      # submodule revisions recorded by that commit.
      # ============================================================

      - name: Pin Theos and Logos to June 2025
        shell: bash
        run: |
          set -euo pipefail

          cd "$THEOS"

          echo ""
          echo "=========================================="
          echo "CURRENT THEOS"
          echo "=========================================="

          git rev-parse HEAD
          git log -1 --format='%H %ci %s'


          echo ""
          echo "Finding Theos revision from June 2025..."

          LEGACY_THEOS_COMMIT="$(
            git rev-list \
              -n 1 \
              --before='2025-06-14 00:00:00 +0000' \
              origin/master
          )"


          if [ -z "$LEGACY_THEOS_COMMIT" ]; then
            echo "ERROR: Could not find June 2025 Theos revision."
            exit 1
          fi


          echo ""
          echo "Legacy Theos commit:"
          echo "$LEGACY_THEOS_COMMIT"


          git checkout \
            --detach \
            "$LEGACY_THEOS_COMMIT"


          echo ""
          echo "Initializing historical Theos submodules..."

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive


          echo ""
          echo "=========================================="
          echo "PINNED THEOS"
          echo "=========================================="

          git log -1 \
            --format='%H %ci %s'


          echo ""
          echo "Submodule revisions:"

          git submodule status --recursive


          echo ""
          echo "Logos revision:"

          if [ -d vendor/logos ]; then

            cd vendor/logos

            git rev-parse HEAD
            git log -1 --format='%H %ci %s'

          elif [ -d logos ]; then

            cd logos

            git rev-parse HEAD
            git log -1 --format='%H %ci %s'

          else

            echo "Logos directory location:"
            find "$THEOS" \
              -maxdepth 3 \
              -type d \
              -iname '*logos*' \
              -print \
              || true

          fi


      # ============================================================
      # 6. DOWNLOAD IOS SDK
      #
      # Build SDK = 17.5
      # Minimum runtime = iOS 15.0
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv *.sdk "$THEOS/sdks/"


          echo ""
          echo "=========================================="
          echo "INSTALLED SDK"
          echo "=========================================="

          ls -la "$THEOS/sdks/"


      # ============================================================
      # 7. SETUP THEOS-JAILED
      # ============================================================

      - name: Checkout Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install

      - name: Install PSHeader and YouTubeHeader
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "main/Tweaks/PSHeader/Misc.h" ]; then
            echo "ERROR: PSHeader missing."
            exit 1
          fi

          if [ ! -f "main/Tweaks/YouTubeHeader/YTLikeStatus.h" ]; then
            echo "ERROR: YouTubeHeader missing."
            exit 1
          fi

          mkdir -p "$THEOS/include"

          rm -rf "$THEOS/include/PSHeader"
          rm -rf "$THEOS/include/YouTubeHeader"
          rm -rf "$THEOS/include/YTHeaders"

          cp -R main/Tweaks/PSHeader \
            "$THEOS/include/PSHeader"

          cp -R main/Tweaks/YouTubeHeader \
            "$THEOS/include/YouTubeHeader"

          cp -R "$THEOS/include/YouTubeHeader" \
            "$THEOS/include/YTHeaders"

          test -f "$THEOS/include/PSHeader/Misc.h"
          test -f "$THEOS/include/YouTubeHeader/YTLikeStatus.h"

          echo "Headers installed successfully."

      # ============================================================
      # 8. PATCH POSSIBLE BROKEN PIPE ISSUE
      # ============================================================

      - name: Patch Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

            fi

          done


          find "$THEOS" -name "*.mk" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

            fi

          done


      # ============================================================
      # 9. INSTALL CYAN + TBD
      # ============================================================

      - name: Install cyan and tbd
        shell: bash
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

          echo ""
          echo "cyan:"
          command -v cyan || true

          echo ""
          echo "tbd:"
          command -v tbd || true


      # ============================================================
      # 10. STORE PRIVATE YOUTUBE IPA URL
      # ============================================================

      - name: Prepare YouTube URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then

            echo "ERROR: decrypted YouTube IPA URL is empty."
            exit 1

          fi

          echo "::add-mask::$INPUT_URL"

          echo \
            "YOUTUBE_URL=$INPUT_URL" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 11. DOWNLOAD + EXTRACT YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa


          if [ ! -s "main/YouTube.ipa" ]; then

            echo "ERROR: downloaded IPA is empty."
            exit 1

          fi


          echo ""
          echo "Downloaded IPA:"

          ls -lh main/YouTube.ipa


          cd main

          rm -rf Payload

          unzip \
            -q \
            YouTube.ipa


          APP_DIR="$(
            find Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              | head -n 1
          )"


          if [ -z "$APP_DIR" ]; then

            echo "ERROR: .app bundle not found."
            exit 1

          fi


          if [ "$APP_DIR" != "Payload/YouTube.app" ]; then

            echo "Renaming:"
            echo "$APP_DIR"
            echo "-> Payload/YouTube.app"

            mv \
              "$APP_DIR" \
              Payload/YouTube.app

          fi


          PLIST="Payload/YouTube.app/Info.plist"


          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist missing."
            exit 1

          fi


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"


          if [ -z "$VERSION" ]; then

            VERSION="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi


          echo ""
          echo "=========================================="
          echo "YOUTUBE VERSION"
          echo "=========================================="
          echo "$VERSION"


          echo \
            "YT_VERSION=$VERSION" \
            >> "$GITHUB_ENV"

          echo \
            "version=$VERSION" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. CONFIGURE IOS 15 TARGET
      # ============================================================

      - name: Configure iOS 15 build
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          INPUT_BUNDLE: ${{ inputs.bundle_id }}
          INPUT_NAME: ${{ inputs.app_name }}
          INPUT_YT: ${{ steps.youtube.outputs.version }}
        run: |
          set -euo pipefail

          cd main


          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("Makefile")
          s = p.read_text()

          sdk = os.environ["SDK_VERSION"]
          bundle = os.environ["INPUT_BUNDLE"]
          name = os.environ["INPUT_NAME"]
          youtube = os.environ["INPUT_YT"]


          def set_value(pattern, replacement):

              global s

              if re.search(
                  pattern,
                  s,
                  flags=re.MULTILINE
              ):

                  s = re.sub(
                      pattern,
                      replacement,
                      s,
                      count=1,
                      flags=re.MULTILINE
                  )

              else:

                  if not s.endswith("\n"):
                      s += "\n"

                  s += replacement + "\n"


          set_value(
              r'^export TARGET\s*=.*$',
              f'export TARGET = iphone:clang:{sdk}:15.0'
          )

          set_value(
              r'^BUNDLE_ID\s*(?:=|\?=).*$',
              f'BUNDLE_ID = {bundle}'
          )

          set_value(
              r'^DISPLAY_NAME\s*(?:=|\?=).*$',
              f'DISPLAY_NAME = {name}'
          )

          set_value(
              r'^YOUTUBE_VERSION\s*(?:=|\?=).*$',
              f'YOUTUBE_VERSION = {youtube}'
          )


          p.write_text(s)

          print("Main Makefile configured.")
          PY


          echo ""
          echo "=========================================="
          echo "BUILD CONFIG"
          echo "=========================================="

          grep \
            -E \
            '^(export TARGET|BUNDLE_ID|DISPLAY_NAME|YOUTUBE_VERSION)' \
            Makefile \
            || true


      # ============================================================
      # 13. SHOW TOOLCHAIN INFO BEFORE BUILD
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcodebuild -version || true


          echo ""
          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          clang --version || true


          echo ""
          echo "=========================================="
          echo "THEOS"
          echo "=========================================="

          cd "$THEOS"

          git log -1 \
            --format='%H %ci %s'


          echo ""
          echo "=========================================="
          echo "THEOS SUBMODULES"
          echo "=========================================="

          git submodule status --recursive


      # ============================================================
      # 14. BUILD
      #
      # Important:
      # No component is disabled here.
      # We are trying to reproduce the older build environment
      # instead of deleting half of uYouEnhanced.
      # ============================================================

      - name: Build uYouEnhanced IPA
        id: build
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          mkdir \
            -p \
            "$THEOS/lib/iphone/rootless"


          cd main


          echo ""
          echo "=========================================="
          echo "STARTING BUILD"
          echo "=========================================="


          make \
            package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=0 \
            SPONSORBLOCK_ENABLED=0 \
            ADDITIONAL_CFLAGS="-Wno-error=incompatible-pointer-types -Wno-incompatible-pointer-types -Wno-deprecated-declarations"


          echo ""
          echo "=========================================="
          echo "PACKAGE OUTPUT"
          echo "=========================================="


          find \
            packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find \
              packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"


          if [ -z "$IPA_FILE" ]; then

            echo ""
            echo "ERROR: no IPA was produced."

            exit 1

          fi


          IPA_NAME="$(
            basename "$IPA_FILE"
          )"


          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          echo "$IPA_NAME"

          ls -lh "$IPA_FILE"


          echo ""
          echo "SHA256:"

          shasum \
            -a 256 \
            "$IPA_FILE"


          echo \
            "ipa=$IPA_NAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 15. UPLOAD RESULT
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.youtube.outputs.version }}_iOS15
          path: main/packages/${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 16. CREATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-legacy-${{ github.run_number }}
          name: uYouEnhanced iOS 15 Legacy Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/packages/${{ steps.build.outputs.ipa }}

          body: |
            uYouEnhanced iOS/iPadOS 15 custom build.

            YouTube:
            ${{ steps.youtube.outputs.version }}

            uYou:
            ${{ inputs.uyou_version }}

            uYouEnhanced source:
            ${{ inputs.commit_id }}

            Build strategy:
            - Source from v20.05.4-3.0.4 era
            - Theos pinned to June 2025
            - Logos pinned through historical Theos submodule state
            - SDK 17.5
            - Deployment target iOS 15.0
            - Legacy mutable-collection compatibility patch
            - No major uYouEnhanced component disabled

            Intended installer:
            TrollStore
