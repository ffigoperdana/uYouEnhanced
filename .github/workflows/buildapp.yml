name: Build uYouEnhanced iOS 15 - Legacy Fix

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT IOS 15-COMPATIBLE UYOUENHANCED SOURCE
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. GENERIC LEGACY OBJECTIVE-C PATCH
      #
      # Fix patterns such as:
      #
      # NSMutableArray *x = %orig;
      #
      # into:
      #
      # NSArray *x_original = %orig;
      # NSMutableArray *x = [x_original mutableCopy];
      #
      # This applies automatically to ALL tweaks, not only RYD.
      # ============================================================

      - name: Patch legacy mutable collection code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("main")

          extensions = {
              ".x",
              ".xm",
              ".m",
              ".mm",
          }

          mutable_to_immutable = {
              "NSMutableArray": "NSArray",
              "NSMutableDictionary": "NSDictionary",
              "NSMutableSet": "NSSet",
              "NSMutableOrderedSet": "NSOrderedSet",
          }

          pattern = re.compile(
              r'^(?P<indent>\s*)'
              r'(?P<mutable>'
              r'NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet'
              r')'
              r'(?P<generic>\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'(?P<var>[A-Za-z_][A-Za-z0-9_]*)'
              r'\s*=\s*'
              r'(?P<orig>%orig(?:\([^;\n]*\))?)'
              r'\s*;'
              r'(?P<tail>\s*(?://.*)?)$'
          )

          total = 0
          patched_files = []

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix not in extensions:
                  continue

              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue

              lines = original.splitlines()
              output = []

              file_count = 0

              for line in lines:

                  match = pattern.match(line)

                  if not match:
                      output.append(line)
                      continue

                  indent = match.group("indent")
                  mutable = match.group("mutable")
                  generic = match.group("generic") or ""
                  var = match.group("var")
                  orig = match.group("orig")
                  tail = match.group("tail") or ""

                  immutable = mutable_to_immutable[mutable]

                  original_var = f"__uye_legacy_original_{var}"

                  first_line = (
                      f"{indent}"
                      f"{immutable}{generic} *{original_var} = {orig};"
                  )

                  second_line = (
                      f"{indent}"
                      f"{mutable}{generic} *{var} = "
                      f"[{original_var} mutableCopy];"
                      f"{tail}"
                  )

                  print("")
                  print(f"PATCHING: {path}")
                  print(f"  OLD: {line}")
                  print(f"  NEW: {first_line}")
                  print(f"       {second_line}")

                  output.append(first_line)
                  output.append(second_line)

                  total += 1
                  file_count += 1

              if file_count:

                  ending = "\n" if original.endswith("\n") else ""

                  path.write_text(
                      "\n".join(output) + ending
                  )

                  patched_files.append(
                      (str(path), file_count)
                  )

          print("")
          print("==========================================")
          print("LEGACY SOURCE PATCH SUMMARY")
          print("==========================================")
          print(f"Total replacements: {total}")

          for filename, count in patched_files:
              print(f"{count:3}  {filename}")

          print("")
          print("Source compatibility patch completed.")
          PY


      # ============================================================
      # 3. ADD CLANG COMPATIBILITY FLAGS TO ALL MAKEFILES
      #
      # Extra fallback in case another old subproject contains an
      # incompatible pointer declaration not covered above.
      # ============================================================

      - name: Add legacy compiler compatibility flags
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          marker = "# UYOU_IOS15_LEGACY_COMPILER_FIX"

          flags = """
          # UYOU_IOS15_LEGACY_COMPILER_FIX
          ADDITIONAL_CFLAGS += -Wno-incompatible-pointer-types
          ADDITIONAL_CFLAGS += -Wno-error=incompatible-pointer-types
          """

          flags = "\n".join(
              line.strip()
              for line in flags.strip().splitlines()
          ) + "\n"

          count = 0

          for path in Path("main").rglob("Makefile"):

              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue

              if marker in text:
                  continue

              # Insert before the first include so flags are visible
              # while Theos parses/builds the target.
              pos = text.find("\ninclude ")

              if pos == -1:
                  text = text + "\n" + flags
              else:
                  text = (
                      text[:pos]
                      + "\n"
                      + flags
                      + text[pos:]
                  )

              path.write_text(text)

              print(f"Patched compiler flags: {path}")
              count += 1

          print("")
          print(f"Patched {count} Makefile(s).")
          PY


      # ============================================================
      # 4. INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget


      - name: Set GNU Make PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"


      # ============================================================
      # 5. INSTALL THEOS
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive


      # ============================================================
      # 6. DOWNLOAD IOS SDK
      #
      # Compile SDK: 17.5
      # Deployment target: 15.0
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv *.sdk "$THEOS/sdks/"

          echo ""
          echo "=========================================="
          echo "INSTALLED SDK"
          echo "=========================================="

          ls -la "$THEOS/sdks/"


      # ============================================================
      # 7. THEOS-JAILED
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install


      # ============================================================
      # 8. WORKAROUND FOR THEOS BROKEN PIPE PROBLEMS
      # ============================================================

      - name: Patch Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do

            if grep -q '| head' "$SCRIPT" 2>/dev/null; then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" \
                2>/dev/null \
                || true

              echo "Patched: $SCRIPT"

            fi

          done


          find "$THEOS" -name "*.mk" -type f | while read -r MK; do

            if grep -q '| head' "$MK" 2>/dev/null; then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" \
                2>/dev/null \
                || true

              echo "Patched: $MK"

            fi

          done

          echo ""
          echo "Theos pipe compatibility patch completed."


      # ============================================================
      # 9. MASK PRIVATE YOUTUBE IPA URL
      # ============================================================

      - name: Prepare private YouTube URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then
            echo "ERROR: decrypted YouTube IPA URL is empty."
            exit 1
          fi

          echo "::add-mask::$INPUT_URL"

          echo "YOUTUBE_URL=$INPUT_URL" >> "$GITHUB_ENV"

          echo "YouTube URL registered."


      # ============================================================
      # 10. DOWNLOAD + EXTRACT DECRYPTED YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: prepare_youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa

          if [ ! -s "main/YouTube.ipa" ]; then

            echo "ERROR: downloaded IPA is empty."
            exit 1

          fi


          echo ""
          echo "Downloaded IPA:"
          ls -lh main/YouTube.ipa


          cd main

          rm -rf Payload
          rm -f YouTube.zip

          mv YouTube.ipa YouTube.zip

          unzip -q YouTube.zip


          APP_DIR="$(
            find Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              | head -n 1
          )"


          if [ -z "$APP_DIR" ]; then

            echo "ERROR: no .app bundle found in IPA."

            echo ""
            echo "ZIP contents:"

            unzip -l YouTube.zip | head -100

            exit 1

          fi


          echo ""
          echo "Application bundle:"
          echo "$APP_DIR"


          if [ "$APP_DIR" != "Payload/YouTube.app" ]; then

            echo "Renaming bundle to Payload/YouTube.app"

            mv \
              "$APP_DIR" \
              Payload/YouTube.app

          fi


          PLIST="Payload/YouTube.app/Info.plist"


          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist not found."
            exit 1

          fi


          YT_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"


          if [ -z "$YT_VERSION" ]; then

            YT_VERSION="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi


          echo ""
          echo "=========================================="
          echo "YOUTUBE VERSION: $YT_VERSION"
          echo "=========================================="


          echo \
            "youtube_version=$YT_VERSION" \
            >> "$GITHUB_OUTPUT"

          echo \
            "YT_VERSION=$YT_VERSION" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 11. CONFIGURE MAKEFILE
      #
      # SDK: 17.5
      # Minimum iOS: 15.0
      # ============================================================

      - name: Configure iOS 15 build
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        run: |
          set -euo pipefail

          cd main

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("Makefile")

          s = p.read_text()

          sdk = os.environ["SDK_VERSION"]
          bundle = os.environ["BUNDLE_ID"]
          app = os.environ["APP_NAME"]
          youtube = os.environ["YOUTUBE_VERSION"]


          def replace_or_append(pattern, replacement):
              global s

              if re.search(pattern, s, flags=re.MULTILINE):

                  s = re.sub(
                      pattern,
                      replacement,
                      s,
                      count=1,
                      flags=re.MULTILINE,
                  )

              else:

                  if not s.endswith("\n"):
                      s += "\n"

                  s += replacement + "\n"


          replace_or_append(
              r'^export TARGET\s*=.*$',
              f'export TARGET = iphone:clang:{sdk}:15.0'
          )


          replace_or_append(
              r'^DISPLAY_NAME\s*(?:\?=|=).*$',
              f'DISPLAY_NAME = {app}'
          )


          replace_or_append(
              r'^BUNDLE_ID\s*(?:\?=|=).*$',
              f'BUNDLE_ID = {bundle}'
          )


          replace_or_append(
              r'^YOUTUBE_VERSION\s*(?:\?=|=).*$',
              f'YOUTUBE_VERSION = {youtube}'
          )


          p.write_text(s)

          print("Makefile configured.")
          PY


          echo ""
          echo "=========================================="
          echo "FINAL BUILD CONFIG"
          echo "=========================================="

          grep -E \
            '^(export TARGET|DISPLAY_NAME|BUNDLE_ID|YOUTUBE_VERSION)' \
            Makefile \
            || true


          echo ""
          echo "Compiler compatibility flags:"

          grep -n \
            'UYOU_IOS15_LEGACY_COMPILER_FIX' \
            Makefile \
            || true


      # ============================================================
      # 12. VERIFY LEGACY PATTERNS ARE PATCHED
      # ============================================================

      - name: Verify legacy source patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'^\s*'
              r'(?:NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet)'
              r'(?:\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'[A-Za-z_][A-Za-z0-9_]*'
              r'\s*=\s*'
              r'%orig(?:\([^;\n]*\))?'
              r'\s*;',
              flags=re.MULTILINE,
          )

          failures = []

          for path in Path("main").rglob("*"):

              if (
                  not path.is_file()
                  or path.suffix not in {".x", ".xm", ".m", ".mm"}
              ):
                  continue

              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue

              if pattern.search(text):
                  failures.append(str(path))

          if failures:

              print("ERROR: unpatched legacy patterns remain:")

              for item in failures:
                  print(item)

              raise SystemExit(1)

          print(
              "SUCCESS: no known mutable-collection/%orig "
              "legacy patterns remain."
          )
          PY


      # ============================================================
      # 13. BUILD FINAL UYOUENHANCED IPA
      #
      # No cyan/re-injection step.
      # Theos-jailed creates the IPA directly.
      # ============================================================

      - name: Build uYouEnhanced IPA
        id: build_package
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/lib/iphone/rootless"

          cd main


          echo ""
          echo "=========================================="
          echo "STARTING UYOUENHANCED BUILD"
          echo "=========================================="


          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=0 \
            SPONSORBLOCK_ENABLED=0


          echo ""
          echo "=========================================="
          echo "PACKAGE DIRECTORY"
          echo "=========================================="


          find packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"


          if [ -z "$IPA_FILE" ]; then

            echo ""
            echo "ERROR: build finished without creating an IPA."
            echo ""

            find packages \
              -maxdepth 1 \
              -type f \
              -print \
              || true

            exit 1

          fi


          PACKAGE_NAME="$(basename "$IPA_FILE")"


          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo "IPA:"
          echo "$PACKAGE_NAME"

          echo ""
          echo "Size:"
          ls -lh "$IPA_FILE"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$IPA_FILE"


          echo \
            "package=$PACKAGE_NAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 14. UPLOAD IPA
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}_iOS15
          path: main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 15. CREATE PRIVATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-${{ github.run_number }}
          name: uYouEnhanced iOS 15 - Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/packages/${{ steps.build_package.outputs.package }}
          body: |
            uYouEnhanced custom iOS/iPadOS 15 build.

            YouTube:
            ${{ steps.prepare_youtube.outputs.youtube_version }}

            uYou:
            ${{ inputs.uyou_version }}

            Source commit:
            ${{ inputs.commit_id }}

            Compatibility fixes:
            - Automatic legacy NSMutable collection patch
            - Legacy Clang incompatible-pointer compatibility flags
            - iOS 15.0 deployment target
            - SDK 17.5
            - YTUHD disabled for first stable build
            - SponsorBlock optional build flag disabled

            Intended installer:
            TrollStore
