name: Build uYouEnhanced iOS 15 - Clean Legacy Build

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced source commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT UYOUENHANCED RELEASE SOURCE
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v5
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. PATCH OLD MUTABLE COLLECTION CODE
      #
      # Fix old source like:
      #
      # NSMutableArray *foo = %orig;
      #
      # into:
      #
      # NSArray *original = %orig;
      # NSMutableArray *foo = [original mutableCopy];
      #
      # Needed because newer Clang is stricter.
      # ============================================================

      - name: Patch legacy mutable collection assignments
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("main")

          SOURCE_EXTENSIONS = {
              ".x",
              ".xm",
              ".m",
              ".mm",
          }

          TYPE_MAP = {
              "NSMutableArray": "NSArray",
              "NSMutableDictionary": "NSDictionary",
              "NSMutableSet": "NSSet",
              "NSMutableOrderedSet": "NSOrderedSet",
          }

          pattern = re.compile(
              r'^(?P<indent>\s*)'
              r'(?P<mutable>'
              r'NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet'
              r')'
              r'(?P<generic>\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'(?P<var>[A-Za-z_][A-Za-z0-9_]*)'
              r'\s*=\s*'
              r'(?P<orig>%orig(?:\([^;\n]*\))?)'
              r'\s*;'
              r'(?P<tail>\s*(?://.*)?)$'
          )

          total = 0

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix not in SOURCE_EXTENSIONS:
                  continue

              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue

              output = []
              changed = False

              for line in original.splitlines():

                  match = pattern.match(line)

                  if not match:
                      output.append(line)
                      continue

                  indent = match.group("indent")
                  mutable = match.group("mutable")
                  immutable = TYPE_MAP[mutable]
                  generic = match.group("generic") or ""
                  var = match.group("var")
                  orig = match.group("orig")
                  tail = match.group("tail") or ""

                  temp = f"__uye_original_{var}"

                  first = (
                      f"{indent}"
                      f"{immutable}{generic} *{temp} = {orig};"
                  )

                  second = (
                      f"{indent}"
                      f"{mutable}{generic} *{var} = "
                      f"[{temp} mutableCopy];"
                      f"{tail}"
                  )

                  print("")
                  print(f"PATCH: {path}")
                  print(f"OLD: {line}")
                  print(f"NEW: {first}")
                  print(f"     {second}")

                  output.append(first)
                  output.append(second)

                  total += 1
                  changed = True

              if changed:

                  ending = "\n" if original.endswith("\n") else ""

                  path.write_text(
                      "\n".join(output) + ending
                  )

          print("")
          print("==========================================")
          print("MUTABLE PATCH SUMMARY")
          print("==========================================")
          print(f"Total patched assignments: {total}")
          PY


      # ============================================================
      # 3. INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget


      - name: Configure PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"


      # ============================================================
      # 4. CHECKOUT THEOS
      #
      # We fetch full history because we want the June 2025
      # toolchain, not current Logos/Theos.
      # ============================================================

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          fetch-depth: 0
          submodules: false


      # ============================================================
      # 5. PIN THEOS + LOGOS TO JUNE 2025
      #
      # uYouEnhanced 20.05.4-3.0.4 was released June 2025.
      # Using roughly contemporary Logos avoids the newer parser
      # rejecting old %orig syntax.
      # ============================================================

      - name: Pin Theos and Logos to June 2025
        shell: bash
        run: |
          set -euo pipefail

          cd "$THEOS"

          echo ""
          echo "=========================================="
          echo "FINDING JUNE 2025 THEOS"
          echo "=========================================="

          LEGACY_THEOS_COMMIT="$(
            git rev-list \
              -n 1 \
              --before='2025-06-14 00:00:00 +0000' \
              HEAD
          )"

          if [ -z "$LEGACY_THEOS_COMMIT" ]; then
            echo "ERROR: June 2025 Theos commit not found."
            exit 1
          fi

          echo "Using Theos:"
          echo "$LEGACY_THEOS_COMMIT"

          git checkout \
            --detach \
            "$LEGACY_THEOS_COMMIT"

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive


          echo ""
          echo "=========================================="
          echo "PINNED THEOS"
          echo "=========================================="

          git log -1 \
            --format='%H %ci %s'


          echo ""
          echo "Submodules:"

          git submodule status --recursive


      # ============================================================
      # 6. DOWNLOAD IOS SDK
      #
      # SDK = 17.5
      # Runtime deployment target = iOS 15.0
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv \
            *.sdk \
            "$THEOS/sdks/"


          echo ""
          echo "=========================================="
          echo "INSTALLED SDK"
          echo "=========================================="

          ls -la "$THEOS/sdks/"


      # ============================================================
      # 7. SETUP THEOS-JAILED
      # ============================================================

      - name: Checkout Theos Jailed
        uses: actions/checkout@v5
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install


      # ============================================================
      # 8. IMPORTANT HEADER STRATEGY
      #
      # DO NOT copy PSHeader / YouTubeHeader into THEOS/include.
      #
      # Source already contains:
      #
      # main/Tweaks/PSHeader
      # main/Tweaks/YouTubeHeader
      #
      # Root Makefile include path will reference those directly.
      # ============================================================

      - name: Verify source headers
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source headers..."

          test -f \
            "main/Tweaks/PSHeader/Misc.h"

          test -f \
            "main/Tweaks/YouTubeHeader/YTLikeStatus.h"


          # Safety cleanup.
          # There must NOT be another copy under THEOS/include.
          rm -rf \
            "$THEOS/include/PSHeader" \
            "$THEOS/include/YouTubeHeader" \
            "$THEOS/include/YTHeaders"


          echo ""
          echo "Header sources:"

          echo \
            "main/Tweaks/PSHeader/Misc.h"

          echo \
            "main/Tweaks/YouTubeHeader/YTLikeStatus.h"


          echo ""
          echo "Duplicate THEOS/include copies removed."


      # ============================================================
      # 9. PATCH OLD THEOS PIPE BEHAVIOUR IF PRESENT
      # ============================================================

      - name: Patch Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

            fi

          done


          find "$THEOS" -name "*.mk" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

            fi

          done


      # ============================================================
      # 10. PREPARE PRIVATE YOUTUBE IPA URL
      # ============================================================

      - name: Prepare YouTube URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then

            echo "ERROR: decrypted YouTube IPA URL is empty."

            exit 1

          fi


          echo "::add-mask::$INPUT_URL"

          echo \
            "YOUTUBE_URL=$INPUT_URL" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 11. DOWNLOAD + EXTRACT DECRYPTED YOUTUBE
      # ============================================================

      - name: Prepare YouTube IPA
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."


          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa


          if [ ! -s "main/YouTube.ipa" ]; then

            echo "ERROR: downloaded IPA is empty."

            exit 1

          fi


          echo ""
          echo "Downloaded IPA:"

          ls -lh main/YouTube.ipa


          cd main

          rm -rf Payload


          unzip \
            -q \
            YouTube.ipa


          APP_DIR="$(
            find Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              | head -n 1
          )"


          if [ -z "$APP_DIR" ]; then

            echo "ERROR: .app bundle not found."

            exit 1

          fi


          echo ""
          echo "App bundle:"
          echo "$APP_DIR"


          if [ "$APP_DIR" != "Payload/YouTube.app" ]; then

            echo \
              "Renaming application bundle to Payload/YouTube.app"

            mv \
              "$APP_DIR" \
              Payload/YouTube.app

          fi


          PLIST="Payload/YouTube.app/Info.plist"


          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist not found."

            exit 1

          fi


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"


          if [ -z "$VERSION" ]; then

            VERSION="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi


          echo ""
          echo "=========================================="
          echo "YOUTUBE VERSION"
          echo "=========================================="

          echo "$VERSION"


          echo \
            "YT_VERSION=$VERSION" \
            >> "$GITHUB_ENV"


          echo \
            "version=$VERSION" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. CONFIGURE OLD MAKEFILE FOR IOS 15
      #
      # IMPORTANT:
      #
      # ADDITIONAL_CFLAGS keeps:
      #
      # -I$(THEOS_PROJECT_DIR)/Tweaks
      #
      # This is what resolves:
      #
      # <PSHeader/...>
      # <YouTubeHeader/...>
      #
      # without creating duplicate header copies.
      # ============================================================

      - name: Configure iOS 15 Makefile
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          INPUT_BUNDLE: ${{ inputs.bundle_id }}
          INPUT_NAME: ${{ inputs.app_name }}
          INPUT_YOUTUBE_VERSION: ${{ steps.youtube.outputs.version }}
        run: |
          set -euo pipefail

          cd main


          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("Makefile")

          s = p.read_text()

          sdk = os.environ["SDK_VERSION"]
          bundle = os.environ["INPUT_BUNDLE"]
          app_name = os.environ["INPUT_NAME"]
          youtube_version = os.environ["INPUT_YOUTUBE_VERSION"]


          def set_before_common(pattern, replacement):

              global s

              if re.search(
                  pattern,
                  s,
                  flags=re.MULTILINE
              ):

                  s = re.sub(
                      pattern,
                      replacement,
                      s,
                      count=1,
                      flags=re.MULTILINE
                  )

                  return


              marker = "include $(THEOS)/makefiles/common.mk"

              if marker in s:

                  s = s.replace(
                      marker,
                      replacement
                      + "\n\n"
                      + marker,
                      1
                  )

              else:

                  if not s.endswith("\n"):
                      s += "\n"

                  s += replacement + "\n"


          set_before_common(
              r'^export TARGET\s*=.*$',
              f'export TARGET = iphone:clang:{sdk}:15.0'
          )


          set_before_common(
              r'^export SDK_PATH\s*=.*$',
              f'export SDK_PATH = $(THEOS)/sdks/iPhoneOS{sdk}.sdk/'
          )


          set_before_common(
              r'^export SYSROOT\s*=.*$',
              'export SYSROOT = $(SDK_PATH)'
          )


          set_before_common(
              r'^DISPLAY_NAME\s*(?:\?=|=).*$',
              f'DISPLAY_NAME = {app_name}'
          )


          set_before_common(
              r'^BUNDLE_ID\s*(?:\?=|=).*$',
              f'BUNDLE_ID = {bundle}'
          )


          set_before_common(
              r'^YOUTUBE_VERSION\s*(?:\?=|=).*$',
              f'YOUTUBE_VERSION = {youtube_version}'
          )


          #
          # DO NOT remove these include paths.
          #
          # They are intentionally pointing to the source copy:
          #
          # main/Tweaks/YouTubeHeader
          # main/Tweaks/PSHeader
          #
          cflags = (
              'export ADDITIONAL_CFLAGS = '
              '-I$(THEOS_PROJECT_DIR)/Tweaks/RemoteLog '
              '-I$(THEOS_PROJECT_DIR)/Tweaks '
              '-Wno-error=incompatible-pointer-types '
              '-Wno-incompatible-pointer-types '
              '-Wno-deprecated-declarations'
          )


          set_before_common(
              r'^export ADDITIONAL_CFLAGS\s*=.*$',
              cflags
          )


          p.write_text(s)

          print("Makefile configured successfully.")
          PY


          echo ""
          echo "=========================================="
          echo "FINAL MAKEFILE CONFIG"
          echo "=========================================="

          grep \
            -E \
            '^(export TARGET|export SDK_PATH|export SYSROOT|export ADDITIONAL_CFLAGS|DISPLAY_NAME|BUNDLE_ID|YOUTUBE_VERSION)' \
            Makefile \
            || true


      # ============================================================
      # 13. VERIFY THERE IS ONLY ONE YOUTUBEHEADER COPY
      # ============================================================

      - name: Verify header layout
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "HEADER VERIFICATION"
          echo "=========================================="


          test -f \
            "main/Tweaks/YouTubeHeader/YTLikeStatus.h"

          test -f \
            "main/Tweaks/PSHeader/Misc.h"


          if [ -e "$THEOS/include/YouTubeHeader" ]; then

            echo \
              "ERROR: duplicate THEOS/include/YouTubeHeader exists."

            exit 1

          fi


          if [ -e "$THEOS/include/PSHeader" ]; then

            echo \
              "ERROR: duplicate THEOS/include/PSHeader exists."

            exit 1

          fi


          if ! grep \
            -q \
            '\-I$(THEOS_PROJECT_DIR)/Tweaks' \
            main/Makefile
          then

            echo \
              "ERROR: Tweaks include path missing from Makefile."

            exit 1

          fi


          echo \
            "SUCCESS: one header tree only."

          echo \
            "Headers resolved using -I$(THEOS_PROJECT_DIR)/Tweaks"


      # ============================================================
      # 14. BUILD ENVIRONMENT INFO
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcodebuild -version || true


          echo ""
          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          clang --version || true


          echo ""
          echo "=========================================="
          echo "THEOS"
          echo "=========================================="

          cd "$THEOS"

          git log -1 \
            --format='%H %ci %s'


          echo ""
          echo "=========================================="
          echo "THEOS SUBMODULES"
          echo "=========================================="

          git submodule status --recursive


      # ============================================================
      # 15. BUILD UYOUENHANCED
      #
      # IMPORTANT:
      #
      # DO NOT pass ADDITIONAL_CFLAGS=... here.
      #
      # Doing that would overwrite the Makefile include paths and
      # cause PSHeader / YouTubeHeader to disappear again.
      # ============================================================

      - name: Build uYouEnhanced IPA
        id: build
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          mkdir \
            -p \
            "$THEOS/lib/iphone/rootless"


          cd main


          echo ""
          echo "=========================================="
          echo "STARTING BUILD"
          echo "=========================================="


          make \
            package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=0 \
            SPONSORBLOCK_ENABLED=0


          echo ""
          echo "=========================================="
          echo "PACKAGE OUTPUT"
          echo "=========================================="


          find \
            packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find \
              packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1 \
              || true
          )"


          if [ -z "$IPA_FILE" ]; then

            echo ""
            echo "ERROR: build finished but no IPA exists."

            exit 1

          fi


          IPA_NAME="$(
            basename "$IPA_FILE"
          )"


          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          echo "$IPA_NAME"


          echo ""
          echo "Size:"

          ls -lh "$IPA_FILE"


          echo ""
          echo "SHA256:"

          shasum \
            -a 256 \
            "$IPA_FILE"


          echo \
            "ipa=$IPA_NAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 16. UPLOAD IPA
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.youtube.outputs.version }}_iOS15
          path: main/packages/${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 17. CREATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-${{ github.run_number }}
          name: uYouEnhanced iOS 15 Build ${{ github.run_number }}
          draft: true
          prerelease: false

          files: |
            main/packages/${{ steps.build.outputs.ipa }}

          body: |
            Custom uYouEnhanced build for iOS/iPadOS 15.

            YouTube:
            ${{ steps.youtube.outputs.version }}

            uYou:
            ${{ inputs.uyou_version }}

            uYouEnhanced source:
            ${{ inputs.commit_id }}

            Build:
            - iOS SDK 17.5
            - iOS deployment target 15.0
            - Theos/Logos pinned to June 2025
            - PSHeader loaded directly from Tweaks
            - YouTubeHeader loaded directly from Tweaks
            - No duplicated THEOS/include header tree
            - Legacy NSMutable compatibility patch

            Installer:
            TrollStore
