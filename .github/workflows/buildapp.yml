name: Build uYouEnhanced iOS 15 - Patched

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced source commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT IOS 15 COMPATIBLE SOURCE
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. PATCH OLD MUTABLE COLLECTION CODE
      #
      # Fixes old code such as:
      #
      # NSMutableArray *foo = %orig;
      #
      # which newer Clang treats as an incompatible pointer error.
      # ============================================================

      - name: Patch legacy mutable collections
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("main")

          SOURCE_EXTENSIONS = {
              ".x",
              ".xm",
              ".m",
              ".mm",
          }

          TYPES = {
              "NSMutableArray": "NSArray",
              "NSMutableDictionary": "NSDictionary",
              "NSMutableSet": "NSSet",
              "NSMutableOrderedSet": "NSOrderedSet",
          }

          pattern = re.compile(
              r'^(?P<indent>\s*)'
              r'(?P<mutable>'
              r'NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet'
              r')'
              r'(?P<generic>\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'(?P<var>[A-Za-z_][A-Za-z0-9_]*)'
              r'\s*=\s*'
              r'(?P<orig>%orig(?:\([^;\n]*\))?)'
              r'\s*;'
              r'(?P<tail>\s*(?://.*)?)$'
          )

          total = 0

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix not in SOURCE_EXTENSIONS:
                  continue

              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue

              lines = original.splitlines()
              output = []
              changed = False

              for line in lines:

                  match = pattern.match(line)

                  if not match:
                      output.append(line)
                      continue

                  indent = match.group("indent")
                  mutable = match.group("mutable")
                  generic = match.group("generic") or ""
                  var = match.group("var")
                  orig = match.group("orig")
                  tail = match.group("tail") or ""

                  immutable = TYPES[mutable]

                  temp_var = f"__uye_original_{var}"

                  line1 = (
                      f"{indent}"
                      f"{immutable}{generic} *{temp_var} = {orig};"
                  )

                  line2 = (
                      f"{indent}"
                      f"{mutable}{generic} *{var} = "
                      f"[{temp_var} mutableCopy];"
                      f"{tail}"
                  )

                  print("")
                  print(f"PATCH: {path}")
                  print(f"OLD : {line}")
                  print(f"NEW : {line1}")
                  print(f"      {line2}")

                  output.append(line1)
                  output.append(line2)

                  total += 1
                  changed = True

              if changed:

                  ending = "\n" if original.endswith("\n") else ""

                  path.write_text(
                      "\n".join(output) + ending
                  )

          print("")
          print("========================================")
          print("MUTABLE COLLECTION PATCH COMPLETE")
          print("========================================")
          print(f"Total replacements: {total}")
          PY


      # ============================================================
      # 3. PATCH OLD YOUPIP LEGACY CODE
      #
      # Old Logos:
      #
      # return initPlayerPiPControllerIfNeeded(%orig);
      #
      # breaks during Logos preprocessing.
      #
      # Convert it to:
      #
      # id tmp = %orig;
      # return initPlayerPiPControllerIfNeeded(tmp);
      # ============================================================

      - name: Patch YouPiP LegacyPiPCompat
        shell: bash
        run: |
          set -euo pipefail

          FILE="main/Tweaks/YouPiP/LegacyPiPCompat.x"

          if [ ! -f "$FILE" ]; then

            echo "ERROR: $FILE not found."

            echo ""
            echo "Searching for LegacyPiPCompat..."

            find main \
              -iname '*LegacyPiPCompat*' \
              -print \
              || true

            exit 1

          fi


          echo "========================================"
          echo "YOUPIP BEFORE PATCH"
          echo "========================================"

          grep -n \
            "initPlayerPiPControllerIfNeeded" \
            "$FILE" \
            || true


          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "main/Tweaks/YouPiP/LegacyPiPCompat.x"
          )

          original = p.read_text()

          pattern = re.compile(
              r'(?m)^'
              r'(?P<indent>\s*)'
              r'return\s+'
              r'initPlayerPiPControllerIfNeeded'
              r'\(\s*'
              r'(?P<orig>%orig(?:\([^;\n]*\))?)'
              r'\s*\)\s*;'
          )

          counter = 0

          def replacer(match):

              global counter

              counter += 1

              indent = match.group("indent")
              orig = match.group("orig")

              temp = f"__uye_pip_orig_{counter}"

              return (
                  f"{indent}id {temp} = {orig};\n"
                  f"{indent}return "
                  f"initPlayerPiPControllerIfNeeded({temp});"
              )


          patched, count = pattern.subn(
              replacer,
              original
          )


          if count == 0:

              print("")
              print(
                  "WARNING: no direct "
                  "initPlayerPiPControllerIfNeeded(%orig) "
                  "pattern found."
              )

              print("")
              print("Relevant source lines:")

              for number, line in enumerate(
                  original.splitlines(),
                  1
              ):

                  if (
                      "initPlayerPiPControllerIfNeeded"
                      in line
                  ):

                      print(
                          f"{number}: {line}"
                      )

              # Do not fail here.
              # The source may already have been fixed.

          else:

              p.write_text(patched)

              print("")
              print(
                  f"Patched {count} YouPiP call(s)."
              )

          PY


          echo ""
          echo "========================================"
          echo "YOUPIP AFTER PATCH"
          echo "========================================"

          grep -n \
            -B1 \
            -A2 \
            "initPlayerPiPControllerIfNeeded" \
            "$FILE" \
            || true


      # ============================================================
      # 4. ADD COMPILER FALLBACK FLAGS
      #
      # These flags prevent old pointer warnings from becoming
      # fatal errors if another legacy tweak has the same issue.
      # ============================================================

      - name: Add legacy compiler flags
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          marker = (
              "# UYOU_IOS15_LEGACY_FLAGS"
          )

          block = """
          # UYOU_IOS15_LEGACY_FLAGS
          ADDITIONAL_CFLAGS += -Wno-incompatible-pointer-types
          ADDITIONAL_CFLAGS += -Wno-error=incompatible-pointer-types
          """

          block = "\n".join(
              line.strip()
              for line
              in block.strip().splitlines()
          ) + "\n"

          count = 0

          for path in Path("main").rglob(
              "Makefile"
          ):

              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue

              if marker in text:
                  continue

              include_pos = text.find(
                  "\ninclude "
              )

              if include_pos == -1:

                  if not text.endswith("\n"):
                      text += "\n"

                  text += block

              else:

                  text = (
                      text[:include_pos]
                      + "\n"
                      + block
                      + text[include_pos:]
                  )

              path.write_text(text)

              print(
                  f"Compiler flags added: {path}"
              )

              count += 1

          print("")
          print(
              f"Modified {count} Makefile(s)."
          )
          PY


      # ============================================================
      # 5. INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget


      - name: Configure PATH
        shell: bash
        run: |
          echo \
            "$(brew --prefix make)/libexec/gnubin" \
            >> "$GITHUB_PATH"


      # ============================================================
      # 6. SETUP THEOS
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive


      # ============================================================
      # 7. DOWNLOAD IOS 17.5 SDK
      #
      # This is ONLY the compiler SDK.
      # Deployment target remains iOS 15.0.
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv \
            *.sdk \
            "$THEOS/sdks/"


          echo ""
          echo "========================================"
          echo "INSTALLED SDK"
          echo "========================================"

          ls -la "$THEOS/sdks/"


      # ============================================================
      # 8. SETUP THEOS-JAILED
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install


      # ============================================================
      # 9. PATCH THEOS BROKEN PIPE BEHAVIOUR
      # ============================================================

      - name: Patch Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find \
            "$THEOS" \
            -name "*.sh" \
            -type f \
            | while read -r SCRIPT
          do

            if grep \
              -q \
              '| head' \
              "$SCRIPT" \
              2>/dev/null
            then

              sed \
                -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" \
                2>/dev/null \
                || true

              echo "Patched: $SCRIPT"

            fi

          done


          find \
            "$THEOS" \
            -name "*.mk" \
            -type f \
            | while read -r MK
          do

            if grep \
              -q \
              '| head' \
              "$MK" \
              2>/dev/null
            then

              sed \
                -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" \
                2>/dev/null \
                || true

              echo "Patched: $MK"

            fi

          done


      # ============================================================
      # 10. PREPARE PRIVATE YOUTUBE DOWNLOAD URL
      # ============================================================

      - name: Prepare YouTube URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then

            echo \
              "ERROR: decrypted IPA URL is empty."

            exit 1

          fi


          echo \
            "::add-mask::$INPUT_URL"

          echo \
            "YOUTUBE_URL=$INPUT_URL" \
            >> "$GITHUB_ENV"

          echo \
            "YouTube download URL registered."


      # ============================================================
      # 11. DOWNLOAD + EXTRACT DECRYPTED YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "Downloading decrypted YouTube IPA..."


          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa


          if [ ! -s main/YouTube.ipa ]; then

            echo \
              "ERROR: downloaded IPA is empty."

            exit 1

          fi


          echo ""
          echo "Downloaded file:"

          ls \
            -lh \
            main/YouTube.ipa


          cd main


          rm \
            -rf \
            Payload


          unzip \
            -q \
            YouTube.ipa


          APP_DIR="$(
            find \
              Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              | head -n 1
          )"


          if [ -z "$APP_DIR" ]; then

            echo \
              "ERROR: .app bundle not found."

            exit 1

          fi


          echo ""
          echo "Application bundle:"
          echo "$APP_DIR"


          if [ "$APP_DIR" != "Payload/YouTube.app" ]; then

            echo \
              "Renaming bundle to YouTube.app"

            mv \
              "$APP_DIR" \
              Payload/YouTube.app

          fi


          PLIST="Payload/YouTube.app/Info.plist"


          if [ ! -f "$PLIST" ]; then

            echo \
              "ERROR: Info.plist not found."

            exit 1

          fi


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c \
              "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"


          if [ -z "$VERSION" ]; then

            VERSION="$(
              /usr/libexec/PlistBuddy \
                -c \
                "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi


          echo ""
          echo "========================================"
          echo "YOUTUBE VERSION: $VERSION"
          echo "========================================"


          echo \
            "YT_VERSION=$VERSION" \
            >> "$GITHUB_ENV"


          echo \
            "version=$VERSION" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. FORCE IOS 15 DEPLOYMENT TARGET
      # ============================================================

      - name: Configure iOS 15 build
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          BUNDLE: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          YT_VERSION: ${{ steps.youtube.outputs.version }}
        run: |
          set -euo pipefail

          cd main


          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("Makefile")

          s = p.read_text()

          sdk = os.environ["SDK_VERSION"]
          bundle = os.environ["BUNDLE"]
          app = os.environ["APP_NAME"]
          yt = os.environ["YT_VERSION"]


          def set_value(pattern, value):

              global s

              if re.search(
                  pattern,
                  s,
                  flags=re.MULTILINE
              ):

                  s = re.sub(
                      pattern,
                      value,
                      s,
                      count=1,
                      flags=re.MULTILINE
                  )

              else:

                  if not s.endswith("\n"):
                      s += "\n"

                  s += value + "\n"


          set_value(
              r'^export TARGET\s*=.*$',
              f'export TARGET = iphone:clang:{sdk}:15.0'
          )

          set_value(
              r'^BUNDLE_ID\s*(?:=|\?=).*$',
              f'BUNDLE_ID = {bundle}'
          )

          set_value(
              r'^DISPLAY_NAME\s*(?:=|\?=).*$',
              f'DISPLAY_NAME = {app}'
          )

          set_value(
              r'^YOUTUBE_VERSION\s*(?:=|\?=).*$',
              f'YOUTUBE_VERSION = {yt}'
          )


          p.write_text(s)

          print("Main Makefile configured.")
          PY


          echo ""
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"


          grep \
            -E \
            '^(export TARGET|BUNDLE_ID|DISPLAY_NAME|YOUTUBE_VERSION)' \
            Makefile \
            || true


      # ============================================================
      # 13. VERIFY LEGACY MUTABLE PATTERNS
      # ============================================================

      - name: Verify mutable patches
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'^\s*'
              r'(?:'
              r'NSMutableArray|'
              r'NSMutableDictionary|'
              r'NSMutableSet|'
              r'NSMutableOrderedSet'
              r')'
              r'(?:\s*<[^;\n=]+?>)?'
              r'\s*\*\s*'
              r'[A-Za-z_][A-Za-z0-9_]*'
              r'\s*=\s*'
              r'%orig(?:\([^;\n]*\))?'
              r'\s*;',
              flags=re.MULTILINE
          )

          failed = []

          for path in Path("main").rglob("*"):

              if (
                  not path.is_file()
                  or
                  path.suffix
                  not in
                  {".x", ".xm", ".m", ".mm"}
              ):

                  continue


              try:

                  text = path.read_text()

              except UnicodeDecodeError:

                  continue


              if pattern.search(text):

                  failed.append(
                      str(path)
                  )


          if failed:

              print(
                  "ERROR: old mutable/%orig "
                  "patterns remain:"
              )

              for path in failed:
                  print(path)

              raise SystemExit(1)


          print(
              "SUCCESS: mutable/%orig "
              "legacy patterns are clean."
          )
          PY


      # ============================================================
      # 14. VERIFY YOUPIP PATCH
      # ============================================================

      - name: Verify YouPiP patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="main/Tweaks/YouPiP/LegacyPiPCompat.x"


          if grep \
            -E \
            -q \
            'return[[:space:]]+initPlayerPiPControllerIfNeeded[[:space:]]*\([[:space:]]*%orig' \
            "$FILE"
          then

            echo ""
            echo \
              "ERROR: unpatched YouPiP %orig call remains."

            echo ""

            grep \
              -n \
              "initPlayerPiPControllerIfNeeded" \
              "$FILE" \
              || true

            exit 1

          fi


          echo \
            "SUCCESS: LegacyPiPCompat is patched."


      # ============================================================
      # 15. BUILD IPA
      #
      # YTUHD and SponsorBlock explicitly disabled first.
      # ============================================================

      - name: Build uYouEnhanced IPA
        id: build
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          mkdir \
            -p \
            "$THEOS/lib/iphone/rootless"


          cd main


          echo ""
          echo "========================================"
          echo "START BUILD"
          echo "========================================"


          make \
            package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=0 \
            SPONSORBLOCK_ENABLED=0


          echo ""
          echo "========================================"
          echo "PACKAGE OUTPUT"
          echo "========================================"


          find \
            packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find \
              packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"


          if [ -z "$IPA_FILE" ]; then

            echo ""
            echo \
              "ERROR: build did not create an IPA."

            exit 1

          fi


          IPA_NAME="$(
            basename \
              "$IPA_FILE"
          )"


          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          echo "$IPA_NAME"

          ls \
            -lh \
            "$IPA_FILE"

          echo ""
          echo "SHA256:"

          shasum \
            -a 256 \
            "$IPA_FILE"


          echo \
            "ipa=$IPA_NAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 16. UPLOAD IPA AS ACTIONS ARTIFACT
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.youtube.outputs.version }}_iOS15
          path: main/packages/${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 17. CREATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-build-${{ github.run_number }}
          name: uYouEnhanced iOS 15 Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/packages/${{ steps.build.outputs.ipa }}

          body: |
            Custom uYouEnhanced build for iOS/iPadOS 15.

            YouTube:
            ${{ steps.youtube.outputs.version }}

            uYou:
            ${{ inputs.uyou_version }}

            Source:
            ${{ inputs.commit_id }}

            Compatibility patches:
            - Generic NSMutable collection / %orig fix
            - YouPiP LegacyPiPCompat fix
            - Legacy compiler pointer compatibility flags
            - Deployment target iOS 15.0
            - SDK 17.5

            First stable build:
            - YTUHD disabled
            - SponsorBlock build flag disabled

            Intended installer:
            TrollStore
