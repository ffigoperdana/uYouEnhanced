name: Build uYouEnhanced for iOS 15 - No RYD

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean

      sponsorblock:
        description: "Include iSponsorBlock"
        default: false
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT UYOUENHANCED IOS 15 BUILD
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. DISABLE RETURN YOUTUBE DISLIKES COMPLETELY
      #
      # The old RYD source does not compile cleanly with the
      # newer compiler used by GitHub Actions.
      #
      # We remove:
      # - Tweaks/Return-YouTube-Dislikes from SUBPROJECTS
      # - YouTubeDislikesReturn.dylib from injected dylibs
      # ============================================================

      - name: Disable broken Return YouTube Dislikes
        shell: bash
        run: |
          set -euo pipefail

          MAKEFILE="main/Makefile"

          if [ ! -f "$MAKEFILE" ]; then
            echo "ERROR: main/Makefile not found"
            exit 1
          fi

          echo "========================================="
          echo "RYD REFERENCES BEFORE"
          echo "========================================="

          grep -n -E \
            'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
            "$MAKEFILE" \
            || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path("main/Makefile")

          original = p.read_text()
          lines = original.splitlines()

          result = []

          for line in lines:

              # Completely remove the dylib entry.
              if "YouTubeDislikesReturn.dylib" in line:
                  print("Removing dylib line:")
                  print(line)
                  continue

              # Remove RYD from SUBPROJECTS while preserving
              # everything else on that line.
              if "Tweaks/Return-YouTube-Dislikes" in line:
                  print("Removing RYD from SUBPROJECTS:")
                  print(line)

                  line = line.replace(
                      " Tweaks/Return-YouTube-Dislikes",
                      ""
                  )

                  line = line.replace(
                      "Tweaks/Return-YouTube-Dislikes ",
                      ""
                  )

                  line = line.replace(
                      "Tweaks/Return-YouTube-Dislikes",
                      ""
                  )

              result.append(line)

          ending = "\n" if original.endswith("\n") else ""

          p.write_text(
              "\n".join(result) + ending
          )

          print("")
          print("Makefile modified successfully.")
          PY

          echo ""
          echo "========================================="
          echo "VERIFYING RYD IS GONE"
          echo "========================================="

          if grep -q -E \
            'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
            "$MAKEFILE"; then

            echo "ERROR: RYD is still referenced in Makefile."
            echo ""

            grep -n -E \
              'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
              "$MAKEFILE" \
              || true

            exit 1
          fi

          echo "SUCCESS: Return YouTube Dislikes removed."


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            jq \
            pipx


      - name: Set PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 4. INSTALL THEOS
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive


      # ============================================================
      # 5. DOWNLOAD IOS 17.5 SDK
      #
      # SDK 17.5 is used to COMPILE.
      # Deployment target is still iOS 15.
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv *.sdk "$THEOS/sdks/"

          echo ""
          echo "Installed SDK:"
          ls -la "$THEOS/sdks/"


      # ============================================================
      # 6. THEOS JAILED
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install


      # ============================================================
      # 7. FIX THEOS BROKEN PIPE ISSUES
      # ============================================================

      - name: Fix Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do

            if grep -q '| head' "$SCRIPT" 2>/dev/null; then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" \
                2>/dev/null \
                || true

              echo "Patched: $SCRIPT"

            fi

          done

          find "$THEOS" -name "*.mk" -type f | while read -r MK; do

            if grep -q '| head' "$MK" 2>/dev/null; then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" \
                2>/dev/null \
                || true

              echo "Patched: $MK"

            fi

          done

          echo "Broken pipe fixes applied."


      # ============================================================
      # 8. INSTALL CYAN + TBD
      # ============================================================

      - name: Install cyan and tbd
        shell: bash
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

          echo ""
          echo "cyan path:"
          command -v cyan || true

          echo ""
          echo "tbd path:"
          command -v tbd || true


      # ============================================================
      # 9. PREPARE PRIVATE YOUTUBE IPA URL
      # ============================================================

      - name: Prepare YouTube download URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then
            echo "ERROR: YouTube IPA URL is empty."
            exit 1
          fi

          echo "::add-mask::$INPUT_URL"

          echo "YOUTUBE_URL=$INPUT_URL" >> "$GITHUB_ENV"

          echo "YouTube URL registered."


      # ============================================================
      # 10. DOWNLOAD DECRYPTED YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: prepare_youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa

          if [ ! -s "main/YouTube.ipa" ]; then
            echo "ERROR: YouTube IPA download is empty."
            exit 1
          fi

          echo ""
          echo "Downloaded file:"
          ls -lh main/YouTube.ipa

          cd main

          rm -rf Payload

          unzip -q YouTube.ipa

          APP_DIR="$(
            find Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app found inside IPA."
            exit 1
          fi

          echo ""
          echo "App bundle found:"
          echo "$APP_DIR"

          if [ "$APP_DIR" != "Payload/YouTube.app" ]; then

            echo ""
            echo "Renaming app bundle to Payload/YouTube.app"

            mv "$APP_DIR" Payload/YouTube.app

          fi

          PLIST="Payload/YouTube.app/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: YouTube Info.plist not found."
            exit 1
          fi

          YT_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"

          if [ -z "$YT_VERSION" ]; then

            YT_VERSION="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi

          echo ""
          echo "========================================="
          echo "YOUTUBE VERSION: $YT_VERSION"
          echo "========================================="

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          echo \
            "youtube_version=$YT_VERSION" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. FINAL CHECK THAT RYD IS STILL DISABLED
      # ============================================================

      - name: Verify RYD remains disabled
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Makefile immediately before build..."

          if grep -q -E \
            'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
            main/Makefile; then

            echo ""
            echo "ERROR: RYD came back before compilation!"
            echo ""

            grep -n -E \
              'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
              main/Makefile \
              || true

            exit 1

          fi

          echo "SUCCESS: RYD is not included in build."


      # ============================================================
      # 12. CONFIGURE IOS 15 + BUILD
      # ============================================================

      - name: Build uYouEnhanced Package
        id: build_package
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          cd main

          echo ""
          echo "========================================="
          echo "CONFIGURING MAKEFILE"
          echo "========================================="

          # Bundle ID
          if grep -q '^BUNDLE_ID ' Makefile; then

            sed -i '' \
              "s/^BUNDLE_ID .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" \
              Makefile

          else

            echo \
              "BUNDLE_ID = ${{ inputs.bundle_id }}" \
              >> Makefile

          fi


          # App name
          if grep -q '^DISPLAY_NAME ' Makefile; then

            sed -i '' \
              "s/^DISPLAY_NAME .*/DISPLAY_NAME = ${{ inputs.app_name }}/" \
              Makefile

          else

            echo \
              "DISPLAY_NAME = ${{ inputs.app_name }}" \
              >> Makefile

          fi


          # IMPORTANT:
          # Compile using SDK 17.5
          # but support iOS 15.0+
          if grep -q '^export TARGET ' Makefile; then

            sed -i '' \
              "s/^export TARGET .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0/" \
              Makefile

          else

            echo \
              "export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0" \
              >> Makefile

          fi


          echo ""
          echo "Relevant Makefile configuration:"

          grep -E \
            '^(BUNDLE_ID|DISPLAY_NAME|export TARGET)' \
            Makefile \
            || true


          echo ""
          echo "========================================="
          echo "VERIFY RYD BEFORE MAKE"
          echo "========================================="

          if grep -q -E \
            'Return-YouTube-Dislikes|YouTubeDislikesReturn' \
            Makefile; then

            echo "ERROR: RYD unexpectedly found."
            exit 1

          fi

          echo "RYD = DISABLED"


          echo ""
          echo "========================================="
          echo "STARTING BUILD"
          echo "========================================="

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }} \
            SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}


          echo ""
          echo "========================================="
          echo "GENERATED PACKAGES"
          echo "========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )"


          if [ -z "$IPA_FILE" ]; then

            echo ""
            echo "ERROR: Build completed but no IPA found."
            echo ""

            find packages \
              -maxdepth 1 \
              -type f \
              -print \
              || true

            exit 1

          fi


          PACKAGE_NAME="$(basename "$IPA_FILE")"

          echo ""
          echo "Base IPA produced:"
          echo "$PACKAGE_NAME"

          echo \
            "package=$PACKAGE_NAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 13. CREATE FINAL IPA
      # ============================================================

      - name: Inject tweaks into IPA
        id: final_ipa
        shell: bash
        run: |
          set -euo pipefail

          IPA_IN="main/packages/${{ steps.build_package.outputs.package }}"

          if [ ! -f "$IPA_IN" ]; then

            echo "ERROR: Base IPA not found:"
            echo "$IPA_IN"

            exit 1

          fi


          OUTNAME="uYouEnhanced_${YT_VERSION}_v${{ inputs.uyou_version }}_iOS15_NoRYD.ipa"


          echo ""
          echo "Base IPA:"
          echo "$IPA_IN"


          TWEAKS=()

          while IFS= read -r -d '' FILE; do

            TWEAKS+=("$FILE")

          done < <(
            find main/packages \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print0
          )


          echo ""
          echo "Generated tweak packages:"

          if [ "${#TWEAKS[@]}" -gt 0 ]; then

            printf '%s\n' "${TWEAKS[@]}"

            echo ""
            echo "Injecting generated tweak packages..."

            cyan \
              -i "$IPA_IN" \
              -o "$OUTNAME" \
              -uwef "${TWEAKS[@]}" \
              -n "${{ inputs.app_name }}" \
              -b "${{ inputs.bundle_id }}"

          else

            echo "No extra .deb files found."
            echo "Using base IPA produced by Theos."

            cp "$IPA_IN" "$OUTNAME"

          fi


          if [ ! -f "$OUTNAME" ]; then

            echo "ERROR: Final IPA was not created."
            exit 1

          fi


          mkdir -p main/final

          cp \
            "$OUTNAME" \
            "main/final/$OUTNAME"


          echo ""
          echo "========================================="
          echo "FINAL IPA CREATED"
          echo "========================================="

          ls -lh "main/final/$OUTNAME"


          echo \
            "final_ipa=$OUTNAME" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 14. UPLOAD RESULT AS ARTIFACT
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}_iOS15_NoRYD
          path: main/final/${{ steps.final_ipa.outputs.final_ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 15. CREATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-build-${{ github.run_number }}
          name: uYouEnhanced iOS 15 - Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/final/${{ steps.final_ipa.outputs.final_ipa }}
          body: |
            uYouEnhanced build for iOS/iPadOS 15.

            Return YouTube Dislikes:
            DISABLED

            YouTube:
            ${{ steps.prepare_youtube.outputs.youtube_version }}

            uYou:
            ${{ inputs.uyou_version }}

            Source commit:
            ${{ inputs.commit_id }}

            Intended installation:
            TrollStore
