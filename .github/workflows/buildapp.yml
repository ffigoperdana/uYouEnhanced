name: Build uYouEnhanced iOS 15 - Stable

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced source commit"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos


    steps:

      # ============================================================
      # 1. CHECKOUT OLD IOS 15-COMPATIBLE SOURCE
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. DISABLE LEGACY COMPONENTS THAT FAIL ON MODERN TOOLCHAIN
      #
      # Disabled:
      # - Return YouTube Dislikes
      # - YTABConfig
      # - YouPiP
      #
      # They can be restored later after we have a working IPA.
      # ============================================================

      - name: Disable incompatible legacy tweaks
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("main/Makefile")

          if not p.exists():
              raise SystemExit("ERROR: main/Makefile not found")

          s = p.read_text()

          print("==========================================")
          print("REMOVING LEGACY TWEAKS")
          print("==========================================")

          disabled_projects = [
              "Tweaks/Return-YouTube-Dislikes",
              "Tweaks/YTABConfig",
              "Tweaks/YouPiP",
              "Tweaks/YTVideoOverlay",
          ]

          disabled_dylibs = [
              "YouTubeDislikesReturn.dylib",
              "YTABConfig.dylib",
              "YouPiP.dylib",
              "YTVideoOverlay.dylib",
          ]

          # Remove complete INJECT_DYLIBS lines for the disabled dylibs.
          lines = s.splitlines()

          new_lines = []

          for line in lines:

              if any(dylib in line for dylib in disabled_dylibs):
                  print(f"Removing dylib line: {line}")
                  continue

              # Remove disabled SUBPROJECT tokens while preserving
              # other projects on the same line.
              if "SUBPROJECTS" in line:

                  original_line = line

                  for project in disabled_projects:
                      line = line.replace(project, "")

                  # Normalize excess spaces.
                  line = re.sub(r'[ \t]+', ' ', line).rstrip()

                  if line != original_line:
                      print("Modified SUBPROJECTS:")
                      print(f"  OLD: {original_line}")
                      print(f"  NEW: {line}")

              new_lines.append(line)

          s = "\n".join(new_lines)

          if not s.endswith("\n"):
              s += "\n"

          p.write_text(s)

          print("")
          print("Legacy tweak removal complete.")
          PY


          echo ""
          echo "=========================================="
          echo "VERIFY DISABLED TWEAKS"
          echo "=========================================="

          if grep -E \
            'Tweaks/Return-YouTube-Dislikes|Tweaks/YTABConfig|Tweaks/YouPiP|Tweaks/YTVideoOverlay|YouTubeDislikesReturn\.dylib|YTABConfig\.dylib|YouPiP\.dylib|YTVideoOverlay\.dylib' \
            main/Makefile
          then

            echo ""
            echo "ERROR: disabled tweak reference remains in main Makefile"
            exit 1

          fi

          echo "SUCCESS: RYD, YTABConfig and YouPiP are disabled."


      # ============================================================
      # 3. ADD COMPILER COMPATIBILITY FLAGS
      #
      # Helps old Objective-C projects compile on modern Clang.
      # ============================================================

      - name: Add legacy compiler compatibility flags
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          marker = "# UYOU_IOS15_COMPAT_FLAGS"

          block = """
          # UYOU_IOS15_COMPAT_FLAGS
          ADDITIONAL_CFLAGS += -Wno-error
          ADDITIONAL_CFLAGS += -Wno-incompatible-pointer-types
          ADDITIONAL_CFLAGS += -Wno-error=incompatible-pointer-types
          ADDITIONAL_CFLAGS += -Wno-deprecated-declarations
          """

          block = "\n".join(
              x.strip()
              for x in block.strip().splitlines()
          ) + "\n"

          count = 0

          for p in Path("main").rglob("Makefile"):

              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue

              if marker in s:
                  continue

              # Put flags before the first Theos include.
              idx = s.find("\ninclude ")

              if idx >= 0:
                  s = s[:idx] + "\n" + block + s[idx:]
              else:
                  if not s.endswith("\n"):
                      s += "\n"
                  s += block

              p.write_text(s)

              print(f"Compatibility flags added: {p}")
              count += 1

          print("")
          print(f"Patched {count} Makefile(s).")
          PY


      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            pipx


      - name: Configure PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 5. SETUP THEOS
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive


      # ============================================================
      # 6. DOWNLOAD IOS SDK
      #
      # SDK 17.5 = compile SDK
      # iOS 15.0 = deployment target
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv *.sdk "$THEOS/sdks/"

          echo ""
          echo "Installed SDKs:"
          ls -la "$THEOS/sdks/"


      # ============================================================
      # 7. SETUP THEOS-JAILED
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed


      - name: Install Theos Jailed
        shell: bash
        run: |
          set -euo pipefail

          ./theos-jailed/install


      # ============================================================
      # 8. THEOS BROKEN PIPE WORKAROUND
      # ============================================================

      - name: Patch Theos broken pipe issue
        shell: bash
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

              echo "Patched: $FILE"

            fi

          done


          find "$THEOS" -name "*.mk" -type f | while read -r FILE
          do

            if grep -q '| head' "$FILE" 2>/dev/null
            then

              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$FILE" \
                2>/dev/null \
                || true

              echo "Patched: $FILE"

            fi

          done


      # ============================================================
      # 9. INSTALL TOOLS USED BY THEOS-JAILED
      # ============================================================

      - name: Install cyan and tbd
        shell: bash
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

          echo ""
          echo "cyan:"
          command -v cyan || true

          echo ""
          echo "tbd:"
          command -v tbd || true


      # ============================================================
      # 10. PREPARE PRIVATE IPA URL
      # ============================================================

      - name: Prepare YouTube URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]
          then
            echo "ERROR: decrypted YouTube URL is empty."
            exit 1
          fi

          echo "::add-mask::$INPUT_URL"

          echo "YOUTUBE_URL=$INPUT_URL" >> "$GITHUB_ENV"

          echo "YouTube download URL registered."


      # ============================================================
      # 11. DOWNLOAD DECRYPTED YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa


          if [ ! -s "main/YouTube.ipa" ]
          then

            echo "ERROR: downloaded IPA is empty."
            exit 1

          fi


          echo ""
          echo "Downloaded IPA:"
          ls -lh main/YouTube.ipa


          cd main

          rm -rf Payload

          unzip \
            -q \
            YouTube.ipa


          APP_DIR="$(
            find Payload \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              | head -n 1
          )"


          if [ -z "$APP_DIR" ]
          then

            echo "ERROR: .app bundle not found inside IPA."
            exit 1

          fi


          echo ""
          echo "App bundle:"
          echo "$APP_DIR"


          if [ "$APP_DIR" != "Payload/YouTube.app" ]
          then

            echo "Renaming to Payload/YouTube.app"

            mv \
              "$APP_DIR" \
              Payload/YouTube.app

          fi


          PLIST="Payload/YouTube.app/Info.plist"


          if [ ! -f "$PLIST" ]
          then

            echo "ERROR: Info.plist not found."
            exit 1

          fi


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )"


          if [ -z "$VERSION" ]
          then

            VERSION="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )"

          fi


          echo ""
          echo "=========================================="
          echo "YOUTUBE VERSION: $VERSION"
          echo "=========================================="


          echo "YT_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. CONFIGURE IOS 15 BUILD
      # ============================================================

      - name: Configure iOS 15 build
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_YT_VERSION: ${{ steps.youtube.outputs.version }}
        run: |
          set -euo pipefail

          cd main


          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("Makefile")

          s = p.read_text()

          sdk = os.environ["SDK_VERSION"]
          bundle = os.environ["INPUT_BUNDLE_ID"]
          name = os.environ["INPUT_APP_NAME"]
          yt = os.environ["INPUT_YT_VERSION"]


          def replace_or_append(pattern, value):

              global s

              if re.search(
                  pattern,
                  s,
                  flags=re.MULTILINE
              ):

                  s = re.sub(
                      pattern,
                      value,
                      s,
                      count=1,
                      flags=re.MULTILINE
                  )

              else:

                  if not s.endswith("\n"):
                      s += "\n"

                  s += value + "\n"


          replace_or_append(
              r'^export TARGET\s*=.*$',
              f'export TARGET = iphone:clang:{sdk}:15.0'
          )

          replace_or_append(
              r'^BUNDLE_ID\s*(?:=|\?=).*$',
              f'BUNDLE_ID = {bundle}'
          )

          replace_or_append(
              r'^DISPLAY_NAME\s*(?:=|\?=).*$',
              f'DISPLAY_NAME = {name}'
          )

          replace_or_append(
              r'^YOUTUBE_VERSION\s*(?:=|\?=).*$',
              f'YOUTUBE_VERSION = {yt}'
          )


          p.write_text(s)

          print("Main Makefile configured.")
          PY


          echo ""
          echo "=========================================="
          echo "FINAL BUILD CONFIG"
          echo "=========================================="

          grep \
            -E \
            '^(export TARGET|BUNDLE_ID|DISPLAY_NAME|YOUTUBE_VERSION)' \
            Makefile \
            || true


      # ============================================================
      # 13. FINAL SANITY CHECK
      #
      # This guarantees the known broken components cannot
      # accidentally be compiled.
      # ============================================================

      - name: Verify stable build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking disabled components..."

          if grep -E \
            'Tweaks/Return-YouTube-Dislikes|Tweaks/YTABConfig|Tweaks/YouPiP|Tweaks/YTVideoOverlay|YouTubeDislikesReturn\.dylib|YTABConfig\.dylib|YouPiP\.dylib|YTVideoOverlay\.dylibTweaks/Return-YouTube-Dislikes|Tweaks/YTABConfig|Tweaks/YouPiP|Tweaks/YTVideoOverlay|YouTubeDislikesReturn\.dylib|YTABConfig\.dylib|YouPiP\.dylib|YTVideoOverlay\.dylib' \
            main/Makefile
          then

            echo ""
            echo "ERROR: broken legacy component is still referenced."
            exit 1

          fi


          echo "SUCCESS:"
          echo "- Return YouTube Dislikes disabled"
          echo "- YTABConfig disabled"
          echo "- YouPiP disabled"


      # ============================================================
      # 14. BUILD IPA
      #
      # YTUHD and iSponsorBlock build flags OFF for first stable
      # build to reduce possible failure points.
      # ============================================================

      - name: Build uYouEnhanced IPA
        id: build
        shell: bash
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          mkdir \
            -p \
            "$THEOS/lib/iphone/rootless"


          cd main


          echo ""
          echo "=========================================="
          echo "STARTING STABLE IOS 15 BUILD"
          echo "=========================================="


          make \
            package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=0 \
            SPONSORBLOCK_ENABLED=0


          echo ""
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="


          find \
            packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          IPA_FILE="$(
            find \
              packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"


          if [ -z "$IPA_FILE" ]
          then

            echo ""
            echo "ERROR: build completed but no IPA was created."
            exit 1

          fi


          IPA_NAME="$(basename "$IPA_FILE")"


          echo ""
          echo "=========================================="
          echo "IPA CREATED SUCCESSFULLY"
          echo "=========================================="

          echo "$IPA_NAME"

          ls \
            -lh \
            "$IPA_FILE"


          echo ""
          echo "SHA256:"

          shasum \
            -a 256 \
            "$IPA_FILE"


          echo "ipa=$IPA_NAME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 15. UPLOAD IPA
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.youtube.outputs.version }}_iOS15_Stable
          path: main/packages/${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 16. CREATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios15-stable-${{ github.run_number }}
          name: uYouEnhanced iOS 15 Stable Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/packages/${{ steps.build.outputs.ipa }}

          body: |
            Custom uYouEnhanced build for iOS/iPadOS 15.

            YouTube:
            ${{ steps.youtube.outputs.version }}

            uYou:
            ${{ inputs.uyou_version }}

            Source commit:
            ${{ inputs.commit_id }}

            Build configuration:
            - iOS deployment target 15.0
            - SDK 17.5
            - Return YouTube Dislikes disabled
            - YTABConfig disabled
            - YouPiP disabled
            - YTUHD disabled
            - SponsorBlock build flag disabled

            Intended installer:
            TrollStore
