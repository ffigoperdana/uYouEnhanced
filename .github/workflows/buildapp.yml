name: Build uYouEnhanced for iOS 15

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "uYouEnhanced commit to build"
        default: "a4da77e56e9fe912899b90993e98571eef00e8db"
        required: true
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create draft release"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean

      sponsorblock:
        description: "Include iSponsorBlock"
        default: false
        required: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. CHECKOUT OLD IOS 15-COMPATIBLE UYOUENHANCED
      # ============================================================

      - name: Checkout uYouEnhanced
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id }}
          submodules: recursive


      # ============================================================
      # 2. PATCH OLD RETURN YOUTUBE DISLIKES
      #
      # Old source assigns NSArray -> NSMutableArray.
      # New compilers treat this as an error.
      # ============================================================

      - name: Patch old Return YouTube Dislikes
        shell: bash
        run: |
          set -euo pipefail

          FILE="main/Tweaks/Return-YouTube-Dislikes/Settings.x"

          if [ ! -f "$FILE" ]; then
            FILE="$(find main \
              -path '*Return-YouTube-Dislikes*' \
              -name 'Settings.x' \
              -print \
              -quit)"
          fi

          if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
            echo "ERROR: Return YouTube Dislikes Settings.x not found."
            echo ""
            echo "Possible Settings.x files:"
            find main -name 'Settings.x' -print || true
            exit 1
          fi

          echo "Patch target:"
          echo "$FILE"
          echo ""

          echo "=== BEFORE PATCH ==="
          grep -n "mutableCategories" "$FILE" || true
          echo ""

          FILE="$FILE" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["FILE"])

          original = p.read_text()
          lines = original.splitlines()

          patched = False
          already_patched = False

          for i, line in enumerate(lines):

              if "mutableCategories" not in line:
                  continue

              # Already fixed
              if "mutableCopy" in line:
                  print("Line is already patched:")
                  print(line)
                  already_patched = True
                  break

              # Handle %orig()
              if "%orig()" in line:
                  lines[i] = line.replace(
                      "%orig()",
                      "[%orig mutableCopy]",
                      1
                  )
                  patched = True
                  break

              # Handle normal Logos %orig
              if "%orig" in line:
                  lines[i] = line.replace(
                      "%orig",
                      "[%orig mutableCopy]",
                      1
                  )
                  patched = True
                  break

          if not patched and not already_patched:
              print("ERROR: mutableCategories was found but could not be patched.")
              print("")
              print("Relevant source lines:")

              for number, line in enumerate(lines, start=1):
                  if (
                      "mutableCategories" in line
                      or "orderedCategories" in line
                  ):
                      print(f"{number}: {line}")

              raise SystemExit(1)

          if patched:
              ending = "\n" if original.endswith("\n") else ""
              p.write_text("\n".join(lines) + ending)
              print("Patch successful.")
          else:
              print("No patch needed.")
          PY

          echo ""
          echo "=== AFTER PATCH ==="
          grep -n "mutableCategories" "$FILE" || true


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            pipx


      - name: Set PATH
        shell: bash
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 4. THEOS
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive


      # ============================================================
      # 5. IOS SDK
      # ============================================================

      - name: Download iOS SDK
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            "iPhoneOS${{ inputs.sdk_version }}.sdk"

          git checkout --quiet

          mv *.sdk "$THEOS/sdks/"

          echo ""
          echo "Installed SDKs:"
          ls -la "$THEOS/sdks/"


      # ============================================================
      # 6. THEOS JAILED
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed


      - name: Install Theos Jailed
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          ./theos-jailed/install


      # ============================================================
      # 7. WORKAROUND FOR NEWER SHELL / MAKE BEHAVIOUR
      # ============================================================

      - name: Fix Theos broken pipe issue
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" 2>/dev/null || true

              echo "Patched: $SCRIPT"
            fi
          done

          find "$THEOS" -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" 2>/dev/null || true

              echo "Patched: $MK"
            fi
          done

          echo "Broken pipe fixes applied."


      # ============================================================
      # 8. CYAN + TBD
      # ============================================================

      - name: Install cyan and tbd
        shell: bash
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

          echo ""
          echo "cyan:"
          command -v cyan || true

          echo ""
          echo "tbd:"
          command -v tbd || true


      # ============================================================
      # 9. MASK DECRYPTED YOUTUBE URL
      # ============================================================

      - name: Prepare YouTube download URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail

          if [ -z "$INPUT_URL" ]; then
            echo "ERROR: decrypted YouTube IPA URL is empty."
            exit 1
          fi

          echo "::add-mask::$INPUT_URL"

          echo "YOUTUBE_URL=$INPUT_URL" >> "$GITHUB_ENV"


      # ============================================================
      # 10. DOWNLOAD + EXTRACT YOUTUBE IPA
      # ============================================================

      - name: Prepare YouTube IPA
        id: prepare_youtube
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading decrypted YouTube IPA..."

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            --show-progress \
            -O main/YouTube.ipa

          if [ ! -s main/YouTube.ipa ]; then
            echo "ERROR: Downloaded IPA is empty."
            exit 1
          fi

          echo ""
          echo "Downloaded IPA size:"
          ls -lh main/YouTube.ipa

          cd main

          unzip -q YouTube.ipa

          if [ ! -d "Payload/YouTube.app" ]; then
            echo "ERROR: Payload/YouTube.app was not found."
            echo ""
            echo "IPA contents:"
            unzip -l YouTube.ipa | head -100
            exit 1
          fi

          PLIST="Payload/YouTube.app/Info.plist"

          YT_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true
          )

          if [ -z "$YT_VERSION" ]; then
            YT_VERSION=$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST"
            )
          fi

          echo ""
          echo "YouTube version detected:"
          echo "$YT_VERSION"

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "youtube_version=$YT_VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. FORCE IOS 15 TARGET + BUILD UYOUENHANCED
      # ============================================================

      - name: Fix compiling and Build Package
        id: build_package
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail

          cd main

          echo ""
          echo "============================================"
          echo "Changing deployment target to iOS 15.0"
          echo "============================================"
          echo ""

          # BUNDLE ID
          if grep -q '^BUNDLE_ID ' Makefile; then
            sed -i '' \
              "s/^BUNDLE_ID .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" \
              Makefile
          else
            echo "BUNDLE_ID = ${{ inputs.bundle_id }}" >> Makefile
          fi

          # APP NAME
          if grep -q '^DISPLAY_NAME ' Makefile; then
            sed -i '' \
              "s/^DISPLAY_NAME .*/DISPLAY_NAME = ${{ inputs.app_name }}/" \
              Makefile
          else
            echo "DISPLAY_NAME = ${{ inputs.app_name }}" >> Makefile
          fi

          # IMPORTANT:
          # old workflow/main currently targets iOS 16.
          # iPad mini 4 needs iOS/iPadOS 15 support.
          if grep -q '^export TARGET ' Makefile; then
            sed -i '' \
              "s/^export TARGET .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0/" \
              Makefile
          else
            echo \
              "export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0" \
              >> Makefile
          fi

          echo ""
          echo "Relevant Makefile values:"
          grep -E \
            '^(BUNDLE_ID|DISPLAY_NAME|export TARGET)' \
            Makefile \
            || true

          echo ""
          echo "============================================"
          echo "BUILDING"
          echo "============================================"
          echo ""

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }} \
            SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}

          echo ""
          echo "============================================"
          echo "PACKAGES"
          echo "============================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          PACKAGE_FILE=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )

          if [ -z "$PACKAGE_FILE" ]; then
            echo ""
            echo "ERROR: Build succeeded but no IPA was created."
            exit 1
          fi

          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"

          echo ""
          echo "Base IPA:"
          echo "$PACKAGE_NAME"

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. INJECT BUILT TWEAKS INTO IPA
      # ============================================================

      - name: Inject tweaks into IPA
        id: final_ipa
        shell: bash
        run: |
          set -euo pipefail

          IPA_IN="main/packages/${{ steps.build_package.outputs.package }}"

          if [ ! -f "$IPA_IN" ]; then
            echo "ERROR: Base IPA not found:"
            echo "$IPA_IN"
            exit 1
          fi

          OUTNAME="uYouEnhanced_${YT_VERSION}_v${{ inputs.uyou_version }}_iOS15.ipa"

          TWEAKS=()

          while IFS= read -r -d '' FILE; do
            TWEAKS+=("$FILE")
          done < <(
            find main/packages \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print0
          )

          echo ""
          echo "Base IPA:"
          echo "$IPA_IN"

          echo ""
          echo "Tweaks to inject:"

          if [ "${#TWEAKS[@]}" -eq 0 ]; then
            echo "ERROR: No tweak .deb packages were generated."
            find main/packages -maxdepth 1 -type f -print
            exit 1
          fi

          printf '%s\n' "${TWEAKS[@]}"

          echo ""
          echo "Injecting..."

          cyan \
            -i "$IPA_IN" \
            -o "$OUTNAME" \
            -uwef "${TWEAKS[@]}" \
            -n "${{ inputs.app_name }}" \
            -b "${{ inputs.bundle_id }}"

          if [ ! -f "$OUTNAME" ]; then
            echo "ERROR: cyan did not create final IPA."
            exit 1
          fi

          mkdir -p main/final

          cp "$OUTNAME" "main/final/$OUTNAME"

          echo ""
          echo "============================================"
          echo "FINAL IPA"
          echo "============================================"

          ls -lh "main/final/$OUTNAME"

          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 13. UPLOAD IPA AS GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}_iOS15
          path: main/final/${{ steps.final_ipa.outputs.final_ipa }}
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 14. CREATE PRIVATE DRAFT RELEASE
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: uYouEnhanced iOS 15 - Build ${{ github.run_number }}
          draft: true
          prerelease: false
          files: main/final/${{ steps.final_ipa.outputs.final_ipa }}
          body: |
            uYouEnhanced build for iOS/iPadOS 15.

            YouTube:
            ${{ steps.prepare_youtube.outputs.youtube_version }}

            uYou:
            ${{ inputs.uyou_version }}

            Source commit:
            ${{ inputs.commit_id }}

            Built automatically using GitHub Actions.
